services:
  app:
    build: .
    container_name: rabtech-capstone-app
    restart: unless-stopped
    environment:
      APP_MESSAGE: "RabTech Task 6 - Cloud Capstone is running!"
    ports:
      - "80:5000"

  prometheus:
    image: prom/prometheus:latest
    container_name: rabtech-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: rabtech-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-ChangeMe123!}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
